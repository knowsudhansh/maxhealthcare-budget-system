services:
  budget-app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - corp_ca

    image: max-it-opex-budget-app:local
    restart: unless-stopped

    ports:
      - "3001:3000"

    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_BASE_PATH: ${APP_BASE_PATH:-}

      HOST: "0.0.0.0"
      PORT: "3000"

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-4000}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_CA: /run/secrets/tidb-ca.pem

      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      ENABLE_EXCEL_MIRROR: "false"
      ENABLE_GOOGLE_SHEETS_SYNC: "false"

    volumes:
      - budget-app-data:/app/Server data
      - "${TIDB_CA_FILE}:/run/secrets/tidb-ca.pem:ro"

volumes:
  budget-app-data:

secrets:
  corp_ca:
    file: ${CORP_CA_FILE}