apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-app
  namespace: dev
  labels:
    app: budget-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: budget-app
  template:
    metadata:
      labels:
        app: budget-app
    spec:
      containers:
        - name: budget-app
          image: budget-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: budget-app-config
                optional: false
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: budget-app-secrets
                  key: DB_HOST
                  optional: false
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: budget-app-secrets
                  key: DB_NAME
                  optional: false
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: budget-app-secrets
                  key: DB_USER
                  optional: false
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: budget-app-secrets
                  key: DB_PASSWORD
                  optional: false
            - name: AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: budget-app-secrets
                  key: AUTH_SESSION_SECRET
                  optional: false
          volumeMounts:
            - name: tidb-ca
              mountPath: /run/secrets/tidb-ca.pem
              subPath: tidb-ca.pem
              readOnly: true
          readinessProbe:
            httpGet:
              path: /budget-app/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tidb-ca
          secret:
            secretName: budget-app-secrets
            optional: false
            items:
              - key: tidb-ca.pem
                path: tidb-ca.pem
